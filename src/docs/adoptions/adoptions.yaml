paths:
  /api/adoptions:
    get:
      summary: Obtiene todas las adopciones registradas.
      tags:
        - Adoptions
      responses:
        "200":
          description: Lista de adopciones obtenida exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/Adoption'
        "500":
          description: Error interno del servidor.

  /api/adoptions/{aid}:
    get:
      summary: Obtiene una adopción por su ID.
      tags:
        - Adoptions
      parameters:
        - name: aid
          in: path
          required: true
          description: ID de la adopción a buscar.
          schema:
            type: string
      responses:
        "200":
          description: Adopción encontrada.
        "404":
          description: Adopción no encontrada.
        "500":
          description: Error interno del servidor.

  /api/adoptions/{uid}/{pid}:
    post:
      summary: Crea un nuevo registro de adopción asociando un usuario a una mascota.
      tags:
        - Adoptions
      parameters:
        - name: uid
          in: path
          required: true
          description: ID del usuario adoptante.
          schema:
            type: string
        - name: pid
          in: path
          required: true
          description: ID de la mascota a adoptar.
          schema:
            type: string
      responses:
        "200":
          description: Mascota adoptada con éxito.
        "400":
          description: La mascota ya se encuentra adoptada.
        "404":
          description: El usuario o la mascota no fueron encontrados.
        "500":
          description: Error interno del servidor.

components:
  schemas:
    Adoption:
      type: object
      properties:
        _id:
          type: string
          description: ID único de la adopción.
        owner:
          type: string
          description: ID del usuario adoptante.
        pet:
          type: string
          description: ID de la mascota adoptada.
      example:
        _id: "647fa8c9e46dbc5a20320199"
        owner: "647fa8c9e46dbc5a20320181"
        pet: "647fa8c9e46dbc5a20320182"
